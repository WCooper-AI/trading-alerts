[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradealerts"
version = "0.3.0"
description = "Self-hosted backtesting and push alerts for trading rules you define yourself"
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "dukascopy-python>=4.0,<5",  # 5.0.0 fails to import on Python < 3.14
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
stocks = ["exchange_calendars>=4.5"]
dev = ["pytest>=7", "httpx2>=2.16", "ruff>=0.6"]

[project.scripts]
tradealerts = "tradealerts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradealerts = ["templates/*.yaml", "templates/strategies/*.yaml", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deprecations raised from our own code fail the tests, so they're fixed before the library drops them.
filterwarnings = [
    "error::DeprecationWarning:tradealerts.*",
    "error::DeprecationWarning:tests.*",
    "error::FutureWarning:tradealerts.*",
    "error::FutureWarning:tests.*",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # ruff's default set: real errors, not style
# `l` is the bar low next to o/h/c, and short lambdas read fine in rules and test stubs.
ignore = ["E741", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # pytest fixtures imported, then named as test arguments
