# Builds the self-hosted desktop app (with the engine inside) for Windows, macOS and Linux.
# Run it from the Actions tab, or push a tag like v0.2.0. The installers appear as downloads on the run.
name: Desktop app (self-hosted)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04      # .deb, .rpm and .AppImage (older glibc, so it runs on more distros)
          - os: windows-latest    # .msi and setup .exe
          - os: macos-latest      # Apple Silicon .dmg
          - os: macos-15-intel    # Intel .dmg (GitHub's last Intel Mac runner)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the engine
        run: |
          python -m pip install --upgrade pip
          pip install "./engine[yahoo]" pyinstaller
          python selfhost/desktop/engine/build_engine.py

      - name: Linux packages Tauri needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: selfhost/desktop/src-tauri

      # Code signing: add these repository secrets and builds are signed automatically;
      # without them the apps still build, unsigned. Steps: "Building Docs/launch-checklist.md".
      - name: macOS signing keys
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "No Apple certificate: building unsigned"; exit 0; }
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            { echo "$k<<EOV"; printenv "$k"; echo "EOV"; } >> "$GITHUB_ENV"
          done

      - name: Build the app
        working-directory: selfhost/desktop
        run: |
          npm ci
          npx tauri build --config src-tauri/tauri.bundle.json

      - name: Sign Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) { Write-Host "No Windows certificate: installers are unsigned"; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          Get-ChildItem selfhost/desktop/src-tauri/target/release/bundle -Recurse -Include *.msi,*.exe | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $_.FullName
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Remove-Item $pfx

      - uses: actions/upload-artifact@v4
        with:
          name: trading-alerts-selfhosted-${{ matrix.os }}
          path: |
            selfhost/desktop/src-tauri/target/release/bundle/**/*.deb
            selfhost/desktop/src-tauri/target/release/bundle/**/*.rpm
            selfhost/desktop/src-tauri/target/release/bundle/**/*.AppImage
            selfhost/desktop/src-tauri/target/release/bundle/**/*.msi
            selfhost/desktop/src-tauri/target/release/bundle/**/*.exe
            selfhost/desktop/src-tauri/target/release/bundle/**/*.dmg
          if-no-files-found: ignore
